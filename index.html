<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#101814" />
<title>林间木屋 · Forest Cabin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1210; color: #f3efe4;
  }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

  /* ---------- 电影感遮幅 ---------- */
  .filmgate {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,11,9,.44) 0%, rgba(5,11,9,0) 15%, rgba(5,11,9,0) 85%, rgba(5,11,9,.46) 100%),
      radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(4,10,8,.26) 100%);
  }

  /* ---------- 界面 ---------- */
  .hud {
    position: fixed; top: 0; left: 0; z-index: 10;
    padding: clamp(18px, 3.2vw, 42px);
    pointer-events: none;
    opacity: 0; transform: translateY(-8px);
    transition: opacity 1.6s ease .35s, transform 1.6s ease .35s;
  }
  .hud.in { opacity: 1; transform: none; }
  .hud-title {
    font-family: Georgia, "Songti SC", "STSong", "Times New Roman", serif;
    font-size: clamp(20px, 2.5vw, 30px);
    letter-spacing: .26em;
    font-weight: 400;
    color: #f7f3e7;
    text-shadow: 0 2px 24px rgba(0,0,0,.55);
    display: flex; align-items: center;
  }
  .hud-title i {
    display: block; width: clamp(26px, 3.4vw, 46px); height: 1px;
    background: linear-gradient(to right, rgba(226,196,148,.9), rgba(226,196,148,0));
    margin-right: 14px;
  }
  .hud-sub {
    margin-top: 9px;
    font-size: clamp(9px, .78vw, 11px);
    letter-spacing: .32em;
    color: rgba(226,224,210,.58);
    font-weight: 400;
    text-transform: uppercase;
  }

  .hint {
    position: fixed; left: 50%; bottom: clamp(16px, 2.4vw, 30px);
    transform: translateX(-50%) translateY(8px);
    z-index: 10; pointer-events: none;
    font-size: clamp(10px, .8vw, 11.5px);
    letter-spacing: .2em;
    color: rgba(232,230,216,.5);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 1.4s ease 1s, transform 1.4s ease 1s;
  }
  .hint.in { opacity: 1; transform: translateX(-50%); }

  .tools {
    position: fixed; right: clamp(16px, 2.6vw, 34px); bottom: clamp(16px, 2.4vw, 30px);
    z-index: 11; display: flex; gap: 10px;
    opacity: 0; transition: opacity 1.4s ease 1.1s;
  }
  .tools.in { opacity: 1; }
  .tools button {
    appearance: none; border: 1px solid rgba(228,222,200,.22);
    background: rgba(22,32,27,.42);
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    color: rgba(240,236,222,.82);
    font: inherit; font-size: 11px; letter-spacing: .16em;
    padding: 9px 15px; border-radius: 999px;
    cursor: pointer; transition: all .35s ease;
    white-space: nowrap;
  }
  .tools button:hover {
    background: rgba(48,62,50,.62);
    border-color: rgba(232,206,158,.45);
    color: #fdf7e8;
  }
  .tools button.on {
    background: rgba(214,166,96,.16);
    border-color: rgba(226,186,124,.55);
    color: #f6e3c0;
  }
  .tools button:active { transform: scale(.97); }

  /* ---------- 加载 ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 42%, #1a2520 0%, #0c1210 55%, #070b09 100%);
    transition: opacity 1.1s cubic-bezier(.4,0,.2,1), visibility 1.1s;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  .loader-inner { text-align: center; width: min(78vw, 300px); }
  .loader-mark {
    width: 34px; height: 34px; margin: 0 auto 22px;
    opacity: .8;
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity:.42; transform: scale(.96); } 50% { opacity:.92; transform: scale(1.02); } }
  .loader-title {
    font-family: Georgia, "Songti SC", "STSong", serif;
    font-size: 21px; letter-spacing: .34em; color: #efe9d8; margin-bottom: 14px;
  }
  .loader-sub {
    font-size: 9.5px; letter-spacing: .34em; color: rgba(215,211,192,.4);
    text-transform: uppercase; margin-bottom: 26px;
  }
  .loader-bar {
    height: 1px; width: 100%; background: rgba(210,205,182,.14);
    overflow: hidden;
  }
  .loader-bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(to right, rgba(222,184,124,.5), #e9d3a8);
    transition: width .5s cubic-bezier(.3,1,.4,1);
    box-shadow: 0 0 12px rgba(233,211,168,.6);
  }
  .loader-pct {
    margin-top: 12px; font-size: 9px; letter-spacing: .28em;
    color: rgba(215,211,192,.34); font-variant-numeric: tabular-nums;
  }
  .loader-error {
    margin-top: 16px; font-size: 11px; line-height: 1.9;
    color: #e0a98a; letter-spacing: .06em; display: none;
  }

  @media (max-width: 700px) {
    .hud-sub { letter-spacing: .22em; }
    .hint { letter-spacing: .12em; font-size: 10px; }
    .tools button { padding: 8px 12px; font-size: 10px; letter-spacing: .1em; }
  }
  @media (max-width: 430px) {
    .hint { display: none; }
    .hud-title { letter-spacing: .18em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader-mark { animation: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="filmgate"></div>

<header class="hud" id="hud">
  <div class="hud-title"><i></i>林间木屋</div>
  <div class="hud-sub">Forest Cabin &nbsp;—&nbsp; Dusk · Mist · Pinewood</div>
</header>

<div class="hint" id="hint">拖拽环视 · 滚轮缩放 · 双击复位</div>

<div class="tools" id="tools">
  <button id="btnRotate" type="button">自动环绕</button>
  <button id="btnGirl" type="button">走到门前</button>
  <button id="btnReset" type="button">重置视角</button>
</div>

<div id="loader">
  <div class="loader-inner">
    <svg class="loader-mark" viewBox="0 0 48 48" fill="none" stroke="#e2c48c" stroke-width="1.1" stroke-linecap="round">
      <path d="M24 6 L34 22 H28 L36 34 H12 L20 22 H14 Z" />
      <path d="M24 34 V42" />
    </svg>
    <div class="loader-title">林间木屋</div>
    <div class="loader-sub">Growing the forest</div>
    <div class="loader-bar"><i id="bar"></i></div>
    <div class="loader-pct" id="pct">0%</div>
    <div class="loader-error" id="err">场景加载失败，请检查网络后刷新页面。</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* =========================================================
   0. 基础环境
   ========================================================= */
const stageEl  = document.getElementById('stage');
const barEl    = document.getElementById('bar');
const pctEl    = document.getElementById('pct');
const loaderEl = document.getElementById('loader');
const errEl    = document.getElementById('err');

const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 760;
const Q = isMobile ? 0.55 : 1;                       // 细节密度系数
const DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2);

/* 尊重「减少动态效果」偏好，也支持 ?intro=0 直接进入静帧 */
const SKIP_INTRO =
  window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
  new URLSearchParams(location.search).get('intro') === '0';

window.__sceneReady = false;

const setProgress = (v) => {
  barEl.style.width = v + '%';
  pctEl.textContent = Math.round(v) + '%';
};
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* --- 随机与噪声 --- */
const rnd  = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndS = (s = 1) => (Math.random() * 2 - 1) * s;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hash2(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += amp * vnoise(x * f, y * f); f *= 2; amp *= 0.5; }
  return s;
}

/* 地形高度：木屋周围整平 */
function groundHeight(x, z) {
  const d = Math.hypot(x, z);
  let h = (fbm(x * 0.032 + 9.3, z * 0.032 - 4.1) - 0.5) * 4.6;
  h += (fbm(x * 0.115, z * 0.115) - 0.5) * 0.55;
  const flat = THREE.MathUtils.smoothstep(d, 5.4, 14.0);
  return h * flat;
}

/* --- 画布纹理工具 --- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function canvasTex(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
  stencil: false
});
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xbcc8c0);
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.0124);
scene.background = FOG_COLOR.clone();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);

const camEndDesktop  = new THREE.Vector3(13.4, 6.2, 18.2);
const camEndMobile   = new THREE.Vector3(15.6, 7.4, 21.6);

/* 机位预设：默认远景，?view=girl 直接站到门前看她 */
const VIEWS = {
  hero: null,
  girl: { pos: [3.30, 1.62, 7.60], target: [0.62, 1.10, 3.30] },
  side: { pos: [-14.6, 5.7, 14.4], target: [0, 2.4, 0] }
};
const viewKey = (new URLSearchParams(location.search).get('view') || 'hero').toLowerCase();
const camPreset = VIEWS[viewKey];

/* 近景机位放开俯仰与距离限制，远景仍保持原来的安全范围 */
let closeView = !!camPreset;

const camEnd = camPreset
  ? new THREE.Vector3(...camPreset.pos)
  : (isMobile ? camEndMobile : camEndDesktop);
const camStart = camEnd.clone().multiplyScalar(2.05).setY(camEnd.y * 2.15);
camera.position.copy(SKIP_INTRO ? camEnd : camStart);

const TARGET = camPreset
  ? new THREE.Vector3(...camPreset.target)
  : new THREE.Vector3(0, 2.55, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.72;
controls.minDistance = closeView ? 3.2 : 7.5;
controls.maxDistance = 34;
controls.minPolarAngle = 0.34;
controls.maxPolarAngle = Math.PI * 0.494;
controls.autoRotateSpeed = 0.32;
controls.update();

/* =========================================================
   2. 程序化纹理
   ========================================================= */
function makeWoodLogTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#33241a'; g.fillRect(0, 0, 512, 512);
  const rows = 9, rh = 512 / rows;
  for (let r = 0; r < rows; r++) {
    const y0 = r * rh;
    const hue = 24 + Math.random() * 9;
    const light = 26 + Math.random() * 13;
    const grad = g.createLinearGradient(0, y0 + 3, 0, y0 + rh - 3);
    grad.addColorStop(0.00, `hsl(${hue}, 17%, ${(light * 0.62).toFixed(1)}%)`);
    grad.addColorStop(0.30, `hsl(${hue}, 21%, ${(light * 1.20).toFixed(1)}%)`);
    grad.addColorStop(0.62, `hsl(${hue}, 20%, ${(light * 1.32).toFixed(1)}%)`);
    grad.addColorStop(1.00, `hsl(${hue}, 17%, ${(light * 0.50).toFixed(1)}%)`);
    g.fillStyle = grad;
    g.fillRect(0, y0 + 2, 512, rh - 4);

    g.globalAlpha = 0.22;
    for (let i = 0; i < 24; i++) {
      const yy = y0 + 5 + Math.random() * (rh - 10);
      g.strokeStyle = Math.random() > 0.48 ? '#2b1d12' : '#9a7850';
      g.lineWidth = 1;
      g.beginPath();
      for (let x = 0; x <= 512; x += 16) {
        const yv = yy + Math.sin(x * 0.028 + r * 2.3) * 2.6 + Math.sin(x * 0.105) * 0.9;
        x === 0 ? g.moveTo(x, yv) : g.lineTo(x, yv);
      }
      g.stroke();
    }
    g.globalAlpha = 1;

    if (Math.random() < 0.85) {
      const kx = Math.random() * 512, ky = y0 + rh * 0.5;
      for (let k = 5; k > 0; k--) {
        g.beginPath();
        g.ellipse(kx, ky, k * 2.4, k * 1.45, 0, 0, Math.PI * 2);
        g.strokeStyle = `rgba(40,26,14,${0.09 + 0.09 * k})`;
        g.lineWidth = 1.1;
        g.stroke();
      }
    }
    g.fillStyle = 'rgba(16,10,6,0.8)';
    g.fillRect(0, y0, 512, 2.6);
    g.fillStyle = 'rgba(255,238,205,0.055)';
    g.fillRect(0, y0 + 2.6, 512, 1.6);
  }
  return canvasTex(c, 2.5, 1.35);
}

function makeBarkTexture() {
  const [c, g] = makeCanvas(256, 512);
  g.fillStyle = '#443122'; g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 280; i++) {
    const x = Math.random() * 256, w = 1 + Math.random() * 4.5, h = 30 + Math.random() * 170;
    const y = Math.random() * 512, l = 15 + Math.random() * 24;
    g.fillStyle = `hsla(${24 + Math.random() * 10}, 30%, ${l}%, .5)`;
    g.fillRect(x, y, w, h);
  }
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = 'rgba(18,11,6,.55)';
    g.lineWidth = 1 + Math.random() * 1.6;
    g.beginPath();
    const x = Math.random() * 256;
    let y = Math.random() * 512;
    g.moveTo(x, y);
    for (let k = 0; k < 4; k++) { y += 18 + Math.random() * 44; g.lineTo(x + (Math.random() - 0.5) * 9, y); }
    g.stroke();
  }
  return canvasTex(c, 1, 2.4);
}

function makeShingleTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#1a1714'; g.fillRect(0, 0, 512, 512);
  const rows = 8, rh = 64;
  for (let r = 0; r < rows; r++) {
    const y = r * rh;
    const off = (r % 2) * 32;
    for (let x = -64 + off; x < 512; x += 64) {
      const l = 20 + Math.random() * 16;
      g.fillStyle = `hsl(${24 + Math.random() * 8}, ${4 + Math.random() * 7}%, ${l}%)`;
      g.fillRect(x + 1.5, y + 1.5, 61, rh - 2);
      // 木纹
      g.globalAlpha = 0.12;
      for (let k = 0; k < 5; k++) {
        g.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
        g.fillRect(x + 4, y + 6 + k * 10 + Math.random() * 4, 54, 1);
      }
      g.globalAlpha = 1;
      // 下缘投影 / 上缘高光 / 竖向缝
      g.fillStyle = 'rgba(0,0,0,0.46)';
      g.fillRect(x + 1.5, y + rh - 5, 61, 4);
      g.fillStyle = 'rgba(255,240,214,0.12)';
      g.fillRect(x + 1.5, y + 1.5, 61, 2);
      g.fillStyle = 'rgba(0,0,0,0.42)';
      g.fillRect(x, y + 1.5, 1.8, rh - 2);
    }
  }
  return canvasTex(c, 2.0, 2.4);
}

function makeStoneTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#3f3c36'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 110; i++) {
    const w = 34 + Math.random() * 62, h = 24 + Math.random() * 42;
    const x = Math.random() * 512 - w * 0.3, y = Math.random() * 512 - h * 0.3;
    const l = 36 + Math.random() * 24;
    g.fillStyle = `hsl(${28 + Math.random() * 26}, ${5 + Math.random() * 8}%, ${l}%)`;
    roundRectPath(g, x, y, w, h, 6 + Math.random() * 9);
    g.fill();
    g.strokeStyle = 'rgba(24,22,19,.4)'; g.lineWidth = 1.6; g.stroke();
    g.fillStyle = 'rgba(255,250,238,.055)';
    roundRectPath(g, x + 3, y + 2.5, w - 6, h * 0.32, 6); g.fill();
  }
  return canvasTex(c, 1.4, 1.4);
}

function makePlankTexture() {
  const [c, g] = makeCanvas(256, 512);
  g.fillStyle = '#4d3623'; g.fillRect(0, 0, 256, 512);
  const n = 6, pw = 256 / n;
  for (let i = 0; i < n; i++) {
    const x = i * pw;
    const l = 20 + Math.random() * 10;
    const grad = g.createLinearGradient(x, 0, x + pw, 0);
    grad.addColorStop(0, `hsl(26, 30%, ${(l * 0.72).toFixed(1)}%)`);
    grad.addColorStop(0.5, `hsl(26, 32%, ${(l * 1.25).toFixed(1)}%)`);
    grad.addColorStop(1, `hsl(26, 30%, ${(l * 0.8).toFixed(1)}%)`);
    g.fillStyle = grad;
    g.fillRect(x + 1, 0, pw - 2, 512);
    g.globalAlpha = 0.18;
    for (let k = 0; k < 14; k++) {
      g.strokeStyle = Math.random() > 0.5 ? '#2a1b10' : '#9c7a52';
      g.lineWidth = 0.9;
      g.beginPath();
      const xx = x + 3 + Math.random() * (pw - 6);
      g.moveTo(xx, 0);
      for (let y = 0; y <= 512; y += 32) g.lineTo(xx + Math.sin(y * 0.02 + k) * 1.8, y);
      g.stroke();
    }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(20,12,6,.55)';
    g.fillRect(x, 0, 1.6, 512);
  }
  return canvasTex(c, 1.2, 1.6);
}

function makeGroundTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#4a5033'; g.fillRect(0, 0, 512, 512);
  const palette = ['#3d4a2c', '#556040', '#6b6244', '#414d31', '#5c6440', '#4f4a33', '#6d6a4c'];
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const r = 2 + Math.random() * 16;
    g.fillStyle = palette[(Math.random() * palette.length) | 0];
    g.globalAlpha = 0.10 + Math.random() * 0.28;
    g.beginPath();
    g.ellipse(x, y, r, r * (0.4 + Math.random() * 0.9), Math.random() * 3.14, 0, 6.29);
    g.fill();
    g.globalAlpha = 1;
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(126,142,84,.35)' : 'rgba(58,48,32,.35)';
    g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 2 + Math.random() * 4);
  }
  return canvasTex(c, 44, 44);
}

function makeGrassTexture() {
  const [c, g] = makeCanvas(128, 128);
  g.clearRect(0, 0, 128, 128);
  for (let i = 0; i < 30; i++) {
    const x = 6 + Math.random() * 116;
    const w = 1.6 + Math.random() * 2.6;
    const h = 46 + Math.random() * 74;
    const bend = (Math.random() - 0.5) * 28;
    const hue = 82 + Math.random() * 34;
    const l = 17 + Math.random() * 18;
    const grd = g.createLinearGradient(x, 128, x + bend, 128 - h);
    grd.addColorStop(0, `hsl(${hue}, 32%, ${(l * 0.55).toFixed(1)}%)`);
    grd.addColorStop(0.6, `hsl(${hue}, 40%, ${(l * 1.1).toFixed(1)}%)`);
    grd.addColorStop(1, `hsl(${hue}, 48%, ${(l * 1.55).toFixed(1)}%)`);
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(x - w, 128);
    g.quadraticCurveTo(x + bend * 0.35, 128 - h * 0.62, x + bend, 128 - h);
    g.quadraticCurveTo(x + bend * 0.35 + w * 0.8, 128 - h * 0.6, x + w, 128);
    g.closePath();
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* 针叶表面细节：细碎短笔触，叠在顶点色上，破除大面积平涂感 */
function makeNeedleTexture() {
  const [c, g] = makeCanvas(256, 256);
  g.fillStyle = '#b4bdac'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3200; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const len = 3 + Math.random() * 9;
    const ang = -Math.PI / 2 + rnd(0.9, -0.9);
    const v = Math.random();
    g.strokeStyle = v > 0.55
      ? `rgba(${215 + Math.random() * 40 | 0},${225 + Math.random() * 30 | 0},${200 + Math.random() * 30 | 0},${0.10 + Math.random() * 0.16})`
      : `rgba(${40 + Math.random() * 40 | 0},${52 + Math.random() * 40 | 0},${36 + Math.random() * 30 | 0},${0.10 + Math.random() * 0.20})`;
    g.lineWidth = 0.6 + Math.random() * 1.2;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  return canvasTex(c, 3, 3);
}

/* 团絮状烟团贴图：多个柔和圆斑叠加后做圆形遮罩 */
function makeSmokeTexture(size = 160) {
  const [c, g] = makeCanvas(size, size);
  g.clearRect(0, 0, size, size);
  const half = size / 2;
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = Math.pow(Math.random(), 0.7) * half * 0.52;
    const x = half + Math.cos(a) * d;
    const y = half + Math.sin(a) * d;
    const r = half * (0.16 + Math.random() * 0.34);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(255,255,255,0.30)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  const mask = g.createRadialGradient(half, half, half * 0.30, half, half, half * 0.98);
  mask.addColorStop(0, 'rgba(255,255,255,1)');
  mask.addColorStop(0.7, 'rgba(255,255,255,0.82)');
  mask.addColorStop(1, 'rgba(255,255,255,0)');
  g.globalCompositeOperation = 'destination-in';
  g.fillStyle = mask;
  g.fillRect(0, 0, size, size);
  g.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeSoftTexture(inner = 'rgba(255,255,255,1)', size = 256) {  const [c, g] = makeCanvas(size, size);
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, inner);

  grd.addColorStop(0.62, 'rgba(255,255,255,0.14)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildTerrain() {
  const size = 260, segs = isMobile ? 96 : 150;
  const geo = new THREE.PlaneGeometry(size, size, segs, segs);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cMoss  = new THREE.Color(0x8b9668);
  const cGrass = new THREE.Color(0x9aa472);
  const cDirt  = new THREE.Color(0x8a7752);
  const cDark  = new THREE.Color(0x5d6142);
  const tmp = new THREE.Color();
  const baseCol = new THREE.Color(0xffffff);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = groundHeight(x, z);
    pos.setY(i, y);

    const d = Math.hypot(x, z);
    const n1 = fbm(x * 0.06 + 3, z * 0.06 - 7);
    const n2 = fbm(x * 0.21 - 11, z * 0.21 + 5);

    tmp.copy(cMoss).lerp(cGrass, n1);
    if (n2 > 0.58) tmp.lerp(cDirt, (n2 - 0.58) * 1.7);
    if (y < -0.35) tmp.lerp(cDark, clamp(-y * 0.4, 0, 0.55));
    if (d < 7.5) tmp.lerp(cDirt, 0.22);
    baseCol.copy(tmp);

    colors[i * 3] = baseCol.r;
    colors[i * 3 + 1] = baseCol.g;
    colors[i * 3 + 2] = baseCol.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    map: TEX.ground,
    roughness: 0.97,
    metalness: 0,
    envMapIntensity: 0.45
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  scene.add(mesh);
  return mesh;
}

const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.0, 0, 4.35),
  new THREE.Vector3(0.25, 0, 6.4),
  new THREE.Vector3(1.05, 0, 9.3),
  new THREE.Vector3(2.4, 0, 12.9),

]);
const pathSamples = pathCurve.getSpacedPoints(90).map(p => new THREE.Vector2(p.x, p.z));

function distToPath(x, z) {
  let min = Infinity;
  for (let i = 0; i < pathSamples.length; i++) {
    const p = pathSamples[i];
    const dx = x - p.x, dz = z - p.y;
    const d = dx * dx + dz * dz;
    if (d < min) min = d;
  }
  return Math.sqrt(min);
}

/* 土路带 */
(function buildPathRibbon() {
  const N = 90;
  const positions = [], uvs = [], indices = [];
  const p = new THREE.Vector3();
  const tangent = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pathCurve.getPoint(t, p);
    pathCurve.getTangent(t, tangent);
    const nx = -tangent.z, nz = tangent.x;
    const len = Math.hypot(nx, nz) || 1;
    const w = 1.05 + Math.sin(t * 9.0) * 0.12;
    for (let s = -1; s <= 1; s += 2) {
      const x = p.x + (nx / len) * w * s;
      const z = p.z + (nz / len) * w * s;
      positions.push(x, groundHeight(x, z) + 0.045, z);
      uvs.push((s + 1) * 0.5, t * 9);
    }
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const pathTex = TEX.ground.clone();
  pathTex.needsUpdate = true;
  pathTex.repeat.set(1.5, 1);

  const mat = new THREE.MeshStandardMaterial({
    map: pathTex,
    color: 0xbcae90,
    roughness: 1,
    metalness: 0,
    transparent: true,
    opacity: 0.9,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

  const d = new THREE.Object3D();
  const col = new THREE.Color();
  const pnt = new THREE.Vector3();
  const tan = new THREE.Vector3();
  const normal = new THREE.Vector3();

  for (let i = 0; i < count; i++) {

    pathCurve.getPoint(t, pnt);
    pathCurve.getTangent(t, tan);

    const jitterT = (Math.random() - 0.5) * 0.34;
    const x = pnt.x + normal.x * side + tan.x * jitterT;

    d.rotation.set(rnd(0.03, -0.03), tan.x * 0 + Math.random() * Math.PI, rnd(0.03, -0.03));

    mesh.setColorAt(i, col);

})();

function buildPineGeometries() {
  const foliageParts = [];
  const layers = 11;
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const r = 2.05 * (1 - t * 0.87) + 0.11;
    const h = 2.35 - i * 0.05;
    const y = 2.2 + i * 0.80;
    const cone = new THREE.ConeGeometry(r, h, 12, 1, false);
    cone.rotateY(Math.random() * Math.PI * 2);
    cone.translate(rndS(0.07), y, rndS(0.07));
    foliageParts.push(cone);
  }
  const foliage = mergeGeometries(foliageParts, false);
  foliageParts.forEach(c => c.dispose());

  /* 顶点随机外扩，让轮廓像针叶枝簇而不是完美圆锥 */
  const pos = foliage.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const r = Math.hypot(x, z);
    if (r > 0.002) {
      const k = 1 + (hash2(i * 1.73, 3.11) - 0.5) * 0.06;
      pos.setX(i, x * k);
      pos.setZ(i, z * k);
    }
    pos.setY(i, y + (hash2(i * 2.31, 7.77) - 0.5) * 0.04);
  }

  /* 由下至上做深浅渐变，避免「塑料片」感 */
  const vcol = new Float32Array(pos.count * 3);
  const cLow = new THREE.Color(0x212e1e);
  const cHigh = new THREE.Color(0x61724a);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = clamp((y - 0.9) / 10.2, 0, 1);
    tmp.copy(cLow).lerp(cHigh, Math.pow(t, 0.78));
    tmp.multiplyScalar(0.9 + hash2(i * 0.37, 2.2) * 0.2);
    vcol[i * 3] = tmp.r;
    vcol[i * 3 + 1] = tmp.g;
    vcol[i * 3 + 2] = tmp.b;
  }
  foliage.setAttribute('color', new THREE.BufferAttribute(vcol, 3));

  const trunk = new THREE.CylinderGeometry(0.11, 0.38, 4.4, 8, 1, false);
  trunk.translate(0, 2.2, 0);
  return { foliage, trunk };
}

/* 视线走廊：保证初始机位到木屋之间不被树冠遮挡 */
function distToViewAxis(x, z) {
  const ax = camEnd.x, az = camEnd.z;
  const dx = -ax, dz = -az;
  const len2 = dx * dx + dz * dz;
  let t = ((x - ax) * dx + (z - az) * dz) / len2;
  t = clamp(t, -0.22, 1.0);
  const px = ax + dx * t, pz = az + dz * t;
  return Math.hypot(x - px, z - pz);
}

(function placeTrees() {
  const target = Math.round(74 * Q) + 14;
  let tries = 0;
  while (trees.length < target && tries < 4000) {
    tries++;
    const ang = Math.random() * Math.PI * 2;
    const rad = 8.6 + Math.pow(Math.random(), 0.72) * 42;
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    // 避开小路、房屋与初始视线
    if (distToPath(x, z) < 2.9) continue;
    if (Math.abs(x) < 5.2 && z > -5.4 && z < 6.4) continue;
    if (distToViewAxis(x, z) < 7.2) continue;
    if (Math.hypot(x - camEnd.x, z - camEnd.z) < 6.5) continue;

    let ok = true;
    for (const t of trees) {
      const minGap = 12.5 * Math.max(0.7, t.scale);
      if ((t.x - x) ** 2 + (t.z - z) ** 2 < minGap) { ok = false; break; }
    }
    if (!ok) continue;
    const near = rad < 20;
    addTree(x, z, (near ? 0.85 : 0.72) + Math.random() * (near ? 0.7 : 0.85));
  }
  // 手工摆放的框景树（贴近画框边缘，不遮挡主体）
  addTree(-7.6, 9.6, 1.32);
  addTree(11.4, 4.2, 1.12);

  addTree(6.2, -14.5, 1.45);
})();

const CHIMNEY_TOP = new THREE.Vector3(2.16, 6.28, -1.5);
const SMOKE_N = isMobile ? 120 : 240;
const smoke = (() => {
  const positions = new Float32Array(SMOKE_N * 3);
  const sizes = new Float32Array(SMOKE_N);
  const ops = new Float32Array(SMOKE_N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aOpacity', new THREE.BufferAttribute(ops, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    depthTest: true,
    uniforms: { uPR: { value: DPR }, uMap: { value: TEX.smoke } },
    vertexShader: `
      attribute float aSize;
      attribute float aOpacity;
      varying float vA;
      uniform float uPR;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPR * (420.0 / max(-mv.z, 0.5));
        gl_Position = projectionMatrix * mv;
        vA = aOpacity;
      }
    `,
    fragmentShader: `
      uniform sampler2D uMap;
      varying float vA;
      void main() {
        float mask = texture2D(uMap, gl_PointCoord).a;
        float a = mask * vA;
        if (a < 0.004) discard;
        gl_FragColor = vec4(vec3(0.725, 0.735, 0.745), a);
      }
    `
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.renderOrder = 4;
  scene.add(points);

  const parts = [];
  for (let i = 0; i < SMOKE_N; i++) {
    parts.push({
      t: Math.random(),
      speed: 0.06 + Math.random() * 0.055,
      ox: rnd(0.22, -0.22),
      oz: rnd(0.22, -0.22),
      phase: Math.random() * Math.PI * 2,
      swirl: 0.3 + Math.random() * 0.9
    });
  }
  return { geo, positions, sizes, ops, parts, points, mat };
})();

function updateSmoke(dt, time) {
  const { positions, sizes, ops, parts } = smoke;
  for (let i = 0; i < parts.length; i++) {
    const s = parts[i];
    s.t += dt * s.speed;
    if (s.t > 1) {
      s.t -= 1;
      s.ox = rnd(0.2, -0.2);
      s.oz = rnd(0.2, -0.2);
      s.phase = Math.random() * Math.PI * 2;
    }
    const t = s.t;
    const rise = t * 5.6;
    const spread = t * 2.9;
    positions[i * 3]     = CHIMNEY_TOP.x + s.ox + Math.sin(t * 5.2 + s.phase) * spread * 0.7 + t * t * 2.3;
    positions[i * 3 + 1] = CHIMNEY_TOP.y + rise + Math.sin(t * 3.1 + s.phase) * 0.16;
    positions[i * 3 + 2] = CHIMNEY_TOP.z + s.oz + Math.cos(t * 4.4 + s.phase) * spread * 0.62 - t * t * 1.1;

    const fadeIn = THREE.MathUtils.smoothstep(t, 0.0, 0.16);
    const fadeOut = 1.0 - THREE.MathUtils.smoothstep(t, 0.5, 1.0);
    sizes[i] = (0.85 + t * 3.9) * (1 + Math.sin(time * 0.7 + s.phase) * 0.08);
    ops[i] = fadeIn * fadeOut * (0.62 + 0.24 * Math.sin(s.phase * 3.1 + time * 0.9));
  }
  smoke.geo.attributes.position.needsUpdate = true;
  smoke.geo.attributes.aSize.needsUpdate = true;
  smoke.geo.attributes.aOpacity.needsUpdate = true;
}

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: 0.7 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uVignette;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    void main() {
      vec4 tex = texture2D(tDiffuse, vUv);
      vec3 col = tex.rgb;
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      vec3 shadowTint = vec3(0.90, 0.965, 1.03);
      vec3 highTint   = vec3(1.06, 1.0, 0.935);
      col *= mix(shadowTint, highTint, smoothstep(0.10, 0.88, lum));
      col = mix(col, col * vec3(1.02, 1.005, 0.98), 0.35);
      vec2 d = (vUv - 0.5) * vec2(1.0, 0.94);
      float v = smoothstep(0.32, 0.82, length(d));
      col *= 1.0 - v * 0.55 * uVignette;
      float g = hash(vUv * vec2(1920.0, 1080.0) + fract(uTime) * 91.7) - 0.5;
      col += g * 0.020;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), tex.a);
    }
  `
};

let composer = null;

let bloomPass = null;
let gradePass = null;

function buildComposer() {
  const w = window.innerWidth, h = window.innerHeight;
  let rt = null;
  try {
    if (!isMobile) {
      rt = new THREE.WebGLRenderTarget(w * DPR, h * DPR, {
        type: THREE.HalfFloatType,
        samples: 4
      });
    }
  } catch (e) { rt = null; }

  composer = rt ? new EffectComposer(renderer, rt) : new EffectComposer(renderer);
  composer.setPixelRatio(DPR);
  composer.setSize(w, h);
  composer.addPass(new RenderPass(scene, camera));

  try {
    if (!isMobile) {
      bokehPass = new BokehPass(scene, camera, {
        focus: 22, aperture: 0.00028, maxblur: 0.011
      });
      composer.addPass(bokehPass);
    }
  } catch (e) {
    console.warn('DOF pass unavailable', e);
    bokehPass = null;
  }

  bloomPass = new UnrealBloomPass(new THREE.Vector2(w, h), 0.42, 0.78, 0.86);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  gradePass = new ShaderPass(GradeShader);
  composer.addPass(gradePass);
}

const flicker = (t, seed) =>
  0.94 + Math.sin(t * 7.3 + seed) * 0.025 + Math.sin(t * 13.7 + seed * 2.1) * 0.018 + Math.sin(t * 23.1 + seed * 3.7) * 0.012;

/* 相机与树冠的碰撞：环绕时避免钻进树里 */
function resolveCameraCollision() {
  const cp = camera.position;
  for (let i = 0; i < trees.length; i++) {
    const t = trees[i];
    const dx = cp.x - t.x, dz = cp.z - t.z;
    const d2 = dx * dx + dz * dz;
    const hRel = clamp((cp.y - 1.9) / 9.5, 0, 1);
    const canopy = 2.05 * (1 - hRel * 0.87) * t.scale + 0.55;
    if (d2 < canopy * canopy) {
      const d = Math.sqrt(d2) || 0.0001;
      const push = canopy - d;
      cp.x += (dx / d) * push;
      cp.z += (dz / d) * push;
    }
  }
}

const GIRL = {
  url: './girl_web.glb',
  /* 门廊地台上、门左前方一步：地台面 y=0.54，门在 z=2.32 */
  pos: new THREE.Vector3(0.62, 0.54, 3.30),
  faceY: 0.12,          // 面向 +Z（屋外），略侧一点更自然
  scale: 1.0
};
let girlRoot = null;
let girlBaseY = GIRL.pos.y;

function loadGirl() {
  return new Promise((resolve) => {
    new GLTFLoader().load(GIRL.url, (gltf) => {
      const root = gltf.scene;
      root.scale.setScalar(GIRL.scale);
      root.rotation.y = GIRL.faceY;

      root.traverse((o) => {
        if (!o.isMesh) return;
        o.castShadow = true;
        o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (!m) return;
          if (m.map) m.map.anisotropy = 8;
          m.envMapIntensity = 0.5;
          m.metalness = 0;                        // 原始 MR 贴图偏“塑料”，在黄昏光下会反蓝
          m.roughness = Math.min(1, (m.roughness ?? 1) * 1.15);
          if ('specularIntensity' in m) m.specularIntensity = 0.45;  // 原模型 specular ×2，容易过曝
          m.color.setRGB(0.70, 0.60, 0.48);       // 压亮 + 暖调，才和黄昏的木屋同一个色温
          m.needsUpdate = true;
        });
      });

      /* 贴地：以包围盒最低点对齐地台面 */
      root.position.set(GIRL.pos.x, 0, GIRL.pos.z);
      root.updateMatrixWorld(true);
      const bb = new THREE.Box3().setFromObject(root);
      girlBaseY = GIRL.pos.y - bb.min.y + 0.004;
      root.position.y = girlBaseY;

      scene.add(root);
      girlRoot = root;
      resolve(root);
    }, undefined, (e) => {
      console.warn('[girl] 人物模型加载失败：', e);
      if (hintEl) hintEl.textContent = '人物需本地服务器打开（双击 index.html 读不到 .glb）';
      resolve(null);
    });
  });
}

/* =========================================================
   15. 构建完成 → 渲染循环
   ========================================================= */
const clock = new THREE.Clock();
let frameCount = 0;
let shadowsFrozen = false;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  /* 相机入场 */
  if (skipIntro && introT < INTRO_DUR) {
    introT = INTRO_DUR;
    camTween = {
      fromPos: camera.position.clone(), toPos: camEnd.clone(),
      fromTarget: controls.target.clone(), toTarget: TARGET.clone(),
      t: 0, dur: 1.0
    };
  }
  if (introT < INTRO_DUR) {
    introT += dt;
    const k = clamp(introT / INTRO_DUR, 0, 1);
    const e = 1 - Math.pow(1 - k, 3.2);
    camera.position.lerpVectors(camStart, camEnd, e);
    camera.position.y += Math.sin(e * Math.PI) * 1.6;
    camera.position.x += Math.sin(e * Math.PI) * 1.2;
    camera.lookAt(TARGET);
    if (k >= 1) camera.position.copy(camEnd);
  } else if (camTween) {
    camTween.t += dt;
    const k = clamp(camTween.t / camTween.dur, 0, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
    controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
    camera.lookAt(controls.target);
    if (k >= 1) {
      camTween = null;
      controls.update();
    }
  } else {
    controls.update();
  }

  /* 防止相机钻入地面 */
  const minY = groundHeight(camera.position.x, camera.position.z) + (closeView ? 0.9 : 1.35);
  if (camera.position.y < minY) camera.position.y = minY;
  if (!closeView && camera.position.y < 2.2 && camera.position.distanceTo(controls.target) < 12) {
    camera.position.y = 2.2;
  }

  /* 光线与火焰 */
  windowLightL.intensity = 9.0 * flicker(time, 0.0);
  windowLightR.intensity = 9.0 * flicker(time, 2.4);
  lampLight.intensity = 5.2 * flicker(time, 5.1);
  lampGlow.material.opacity = 0.44 + Math.sin(time * 6.1) * 0.04 + Math.sin(time * 11.3) * 0.02;
  MAT.glass.emissiveIntensity = 1.42 + Math.sin(time * 1.3) * 0.05;

  updateSmoke(dt, time);
  updateFireflies(time);

  /* 小女孩：无骨骼，用整体微幅摆动模拟“站着呼吸” */
  if (girlRoot) {
    girlRoot.rotation.y = GIRL.faceY + Math.sin(time * 0.27) * 0.055 + Math.sin(time * 0.11) * 0.03;
    girlRoot.rotation.z = Math.sin(time * 0.41) * 0.005;
    girlRoot.position.y = girlBaseY + Math.sin(time * 1.15) * 0.0035;
  }

  for (let i = 0; i < mists.length; i++) {
    const sp = mists[i];
    const u = sp.userData;
    sp.position.x = u.baseX + Math.sin(time * u.speed + u.phase) * 2.6;
    sp.position.z = u.baseZ + Math.cos(time * u.speed * 0.8 + u.phase) * 2.0;
    sp.material.opacity = (0.045 + Math.sin(time * 0.24 + u.phase) * 0.028 + 0.055) * 0.85;
  }

  /* 景深跟随焦点 */
  if (bokehPass) {
    const dist = camera.position.distanceTo(controls.target);
    if (bokehPass.uniforms['focus']) bokehPass.uniforms['focus'].value = dist;
  }
  if (gradePass) gradePass.uniforms.uTime.value = time;

  if (introT >= INTRO_DUR) {
    resolveCameraCollision();
    camera.lookAt(controls.target);
  }

  if (composer) composer.render();
  else renderer.render(scene, camera);

  frameCount++;
  if (!shadowsFrozen && frameCount > 4) {
    renderer.shadowMap.autoUpdate = false;
    shadowsFrozen = true;
  }
}

/* =========================================================
   16. 启动
   ========================================================= */
(async function start() {
  try {
    await nextFrame();
    setProgress(94);
    // 人物要在首帧之前进场景，否则冻结的阴影贴图里没有她
    await loadGirl();
    await nextFrame();
    // 预编译，避免首帧卡顿
    try { renderer.compile(scene, camera); } catch (e) { /* ignore */ }
    await nextFrame();
    setProgress(100);
    await new Promise(r => setTimeout(r, 260));

    animate();

    loaderEl.classList.add('hide');
    setTimeout(() => {
      hudEl.classList.add('in');
      hintEl.classList.add('in');
      toolsEl.classList.add('in');
      window.__sceneReady = true;
    }, 380);
  } catch (e) {
    console.error(e);
    errEl.style.display = 'block';
  }
})();

/* 超时保护 */
setTimeout(() => {
  if (!window.__sceneReady && !loaderEl.classList.contains('hide')) {
    errEl.style.display = 'block';
    errEl.textContent = '加载时间较长，请确认网络可访问 CDN 后刷新页面。';
  }
}, 15000);
</script>
